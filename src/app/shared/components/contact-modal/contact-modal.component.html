<div class="modal-overlay" [@fadeIn]="true" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()" [@modalEnter]="true">
    <div class="modal-header" [@elementEnter]="true">
      <h2>
        <i class="fas fa-rocket"></i>
        Iniciemos un Proyecto
      </h2>
      <button class="close-button" (click)="closeModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form [formGroup]="form" class="contact-form" (ngSubmit)="onSubmit()">
      <div @staggerElements>
        
        <!-- Nombre -->
        <div class="form-group" [@elementEnter]="true">
          <label for="name">Nombres:</label>
          <input 
            type="text" 
            id="name" 
            name="name"
            formControlName="name" 
            placeholder="Tu nombre"
            autocomplete="name"
            [class.input-error]="form.controls['name'].touched && form.controls['name'].invalid"
          >
          <div class="error-message" *ngIf="form.controls['name'].touched && form.controls['name'].invalid">
            <span *ngIf="form.controls['name'].errors?.['required']">El nombre es obligatorio.</span>
          </div>
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group" [@elementEnter]="true">
          <label for="email">Correo Electrónico:</label>
          <input 
            type="email" 
            id="email" 
            name="email"
            formControlName="email"
            placeholder="tu@email.com"
            autocomplete="email"
            [class.input-error]="form.controls['email'].touched && form.controls['email'].invalid"
          >
          <div class="error-message" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
            <span *ngIf="form.controls['email'].errors?.['required']">El correo es obligatorio.</span>
            <span *ngIf="form.controls['email'].errors?.['email']">El formato del correo no es válido.</span>
          </div>
        </div>

        <!-- Descripción del Proyecto -->
        <div class="form-group" [@elementEnter]="true">
          <label for="project">Descripción del Proyecto:</label>
          <textarea 
            id="project" 
            name="project"
            formControlName="message"
            placeholder="Cuéntame sobre tu proyecto"
            rows="6"
            autocomplete="off"
            [class.input-error]="form.controls['message'].touched && form.controls['message'].invalid"
          ></textarea>
          <div class="error-message" *ngIf="form.controls['message'].touched && form.controls['message'].invalid">
            <span *ngIf="form.controls['message'].errors?.['required']">La descripción del proyecto es obligatoria.</span>
          </div>
        </div>

        <button type="submit" class="cta-button submit-button" [@elementEnter]="true">
          <i class="fas fa-paper-plane"></i>
          Enviar Proyecto
        </button>
      </div>
    </form>
  </div>
</div>
