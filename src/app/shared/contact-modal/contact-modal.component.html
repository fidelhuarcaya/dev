<div class="modal-overlay" [@fadeIn]="true" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()" [@modalEnter]="true">
      <div class="modal-header" [@elementEnter]="true">
        <h2 >
          <i class="fas fa-rocket"></i>
          Iniciemos un Proyecto
        </h2>
        <button class="close-button" (click)="closeModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <form class="contact-form" (ngSubmit)="onSubmit()">
        <div @staggerElements>
          <div class="form-group" [@elementEnter]="true">
            <label for="name">Nombre</label>
            <input 
              type="text" 
              id="name" 
              name="name"
              required 
              placeholder="Tu nombre"
              autocomplete="name"
            >
          </div>

          <div class="form-group" [@elementEnter]="true">
            <label for="email">Correo Electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              required 
              placeholder="tu@email.com"
              autocomplete="email"
            >
          </div>

          <div class="form-group" [@elementEnter]="true">
            <label for="project">Descripción del Proyecto</label>
            <textarea 
              id="project" 
              name="project"
              required 
              placeholder="Cuéntame sobre tu proyecto"
              rows="6"
              autocomplete="off"
            ></textarea>
          </div>

          <button type="submit" class="cta-button submit-button" [@elementEnter]="true">
            <i class="fas fa-paper-plane"></i>
            Enviar Proyecto
          </button>
        </div>
      </form>
    </div>
  </div>
