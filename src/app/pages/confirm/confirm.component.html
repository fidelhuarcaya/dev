<div class="content-main" >
    <div class="card" @slideDown>
        <div class="header">
            <div class="image">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path d="M20 7L9.00004 18L3.99994 13" stroke="#fff" stroke-width="3.5" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                    </g>
                </svg>
            </div>
            <div class="content">
                <h3 class="title">Correo enviado</h3>
                <p class="message">
                    Tu correo ha sido enviado con éxito. Recibirás una respuesta en breve.
                    Agradecemos tu paciencia durante el proceso de envío. Si tienes alguna otra pregunta o necesitas más ayuda, 
                    no dudes en ponerte en contacto.<br><br>

                    
                </p>
                <p class="footer-message">Gracias por comunicarte conmigo.</p>
            </div>
            <div class="actions">
                <button class="cta-button" (click)="return()" type="button">Volver al inicio</button>
                <button class="cta-button secondary" (click)="sendOtherEmail()" type="button">Enviar otro correo</button>
            </div>
        </div>
    </div>
</div>
