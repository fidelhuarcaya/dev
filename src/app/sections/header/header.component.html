<header class="minimal-header" id="header">
  <div class="container">
    <div class="header-content" [@fadeInUp]>

      <h1 class="title">
        <span class="name">Fidel Huarcaya</span>
        <div class="title-badge">
          <i class="fas fa-code"></i>
          Full Stack Developer
        </div>
      </h1>
      <p class="description">
        <span class="role">Desarrollado de Software</span>
        <span class="separator">|</span>
        <span class="role">Innovación</span>
        <span class="separator">|</span>
        <span class="role">Soluciones a medida</span>
      </p>
      <a class="cta-button" (click)="showModal()">
        <i class="fas fa-rocket"></i>
        Iniciemos un proyecto
      </a>
    </div>
  </div>
</header>

<app-contact-modal *ngIf="isModalOpen" [form]="form" (send)="send()" (close)="closeModal()" />
<app-loader *ngIf="isLoading" [message]="message" />
